name: "Bug Report - Downloader"
description: "Report issues related to macOS installer discovery/download flow."
title: "[Downloader] "
labels: ["bug", "downloader"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in all required fields.

  - type: input
    id: app_version
    attributes:
      label: "macUSB version"
      placeholder: "e.g., v2.1"
    validations:
      required: true

  - type: input
    id: host_os_version
    attributes:
      label: "Host macOS version"
      placeholder: "e.g., macOS Sequoia 15.4"
    validations:
      required: true

  - type: dropdown
    id: host_architecture
    attributes:
      label: "Host architecture"
      options:
        - "Apple Silicon"
        - "Intel"
    validations:
      required: true

  - type: checkboxes
    id: required_permissions
    attributes:
      label: "Required permissions"
      options:
        - label: "I enabled Full Disk Access for macUSB in System Settings"
          required: true
        - label: "I enabled Allow in the Background for macUSB in System Settings"
          required: true

  - type: dropdown
    id: helper_repair
    attributes:
      label: "Was helper repair executed? (Tools -> Repair helper)"
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true

  - type: input
    id: downloaded_system
    attributes:
      label: "Which system were you downloading?"
      placeholder: "e.g., macOS Sonoma 14.7.1"
    validations:
      required: true

  - type: dropdown
    id: failure_stage
    attributes:
      label: "Failure stage"
      options:
        - "Installer list"
        - "Download start"
        - "Downloading"
        - "Verification"
        - "Installer assembly"
        - "Download summary"
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "Is the issue reproducible?"
      options:
        - "Always"
        - "Sometimes"
        - "Happened once"
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Open Downloader
        2. Select ...
        3. Click ...
        4. Observe error
    validations:
      required: true

  - type: upload
    id: diagnostic_logs
    attributes:
      label: "Diagnostic logs"
      description: "Export diagnostic logs using Option (⌥) + L, then attach the exported .txt file."
    validations:
      required: true
      accept: ".txt"

  - type: upload
    id: problem_media
    attributes:
      label: "Screenshots or videos"
      description: "Attach screenshots or a video if they help demonstrate the problem."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
